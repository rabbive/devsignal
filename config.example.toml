# devsignal example configuration
# Copy to ~/.config/devsignal/config.toml and set discord.client_id.
# `devsignal init` generates this for you interactively.

poll_interval_secs     = 2    # How often to scan running processes (seconds).
min_push_interval_secs = 20   # Minimum time between Discord IPC pushes (reduces flicker).
idle_mode              = "status"  # "status" = show Idle line; "clear" = hide presence entirely.
show_cwd_basename      = false     # Show the basename of the agent's working directory. Off by default for privacy.

[platforms]
# All known host apps and agents are enabled by default. Add ids here to hide/ignore them.
disabled_hosts  = [] # e.g. ["com.todesktop.230313mzl4w4u92"] to hide Cursor as a host label.
disabled_agents = [] # e.g. ["opencode"] to ignore that agent rule.

[discord]
# Your Discord Application ID from https://discord.com/developers/applications
client_id   = "YOUR_DISCORD_APPLICATION_ID"
large_image = "devsignal"   # Art asset key shown when no agent is detected (idle).
large_text  = "devsignal"   # Hover tooltip for the idle large image.
# small_image = "devsignal" # Optional: small corner icon shown during idle.
# small_text  = "Idle"      # Optional: tooltip for the idle small icon.

# ── Agent rules ────────────────────────────────────────────────────────────────
# process_names:   case-insensitive match against the sysinfo process name OR the
#                  basename of argv[0] (catches wrapped CLIs like "node .../codex").
# argv_substrings: narrow matches when non-empty — at least one must appear in the command line.
# priority:        lower number wins when multiple agents match; ties break on lower PID.
#                  Presets are spaced by 10 so you can slot your own rules between them.
# large_image /
# small_image:     Discord art-asset KEYS, not URLs. Upload them under
#                  Developer Portal → Rich Presence → Art Assets. A key you have not
#                  uploaded renders blank — delete the line to fall back to "devsignal".
# buttons:         up to 2 clickable buttons. More than 2 is rejected at load.
#
# Only agents with confirmed process names ship here. For Gemini CLI, Amp, Copilot CLI, Aider,
# Crush, Qwen Code, Droid, Cline, and Goose, see docs/community-presets.md
# — those names are unconfirmed, so the workflow is:
#     1. start your agent CLI
#     2. devsignal detect --unmatched      # find what your machine actually reports
#     3. devsignal agents add --id <id> --process-name <name> --label "<Label>"

[[agents]]
id            = "claude_code"
label         = "Claude Code"
process_names = ["claude", "claude-code"]
priority      = 10
large_image   = "claude_code"
small_image   = "devsignal"
small_text    = "devsignal"

  [[agents.buttons]]
  label = "Claude Code Docs"
  url   = "https://claude.ai/code"

[[agents]]
id            = "codex"
label         = "Codex"
process_names = ["codex"]
priority      = 20
large_image   = "codex"
small_image   = "devsignal"
small_text    = "devsignal"

  [[agents.buttons]]
  label = "Codex on GitHub"
  url   = "https://github.com/openai/codex"

[[agents]]
id            = "opencode"
label         = "OpenCode"
process_names = ["opencode"]
priority      = 30
large_image   = "opencode"
small_image   = "devsignal"
small_text    = "devsignal"

  [[agents.buttons]]
  label = "OpenCode Docs"
  url   = "https://opencode.ai"

# The cursor-agent CLI is a bash wrapper that ends in `exec -a "$0" node .../index.js`, so the
# process name is "node" and only the basename of argv[0] identifies it. Matching covers both.
[[agents]]
id            = "cursor_agent"
label         = "Cursor Agent"
process_names = ["cursor-agent"]
priority      = 40
large_image   = "cursor_agent"
small_image   = "devsignal"
small_text    = "devsignal"

# ── Presence rules (optional) ──────────────────────────────────────────────────
# First match wins, evaluated in file order. `when` fields are ANDed; within a
# field the list is ORed. A rule whose `then` does nothing is rejected, because it
# would still match and shadow every rule after it.
#
# [[rules]]
# name = "terminal_deep_work"
# when = { host_bundle_ids = ["com.apple.Terminal"], agent_ids = ["claude_code"], active_only = true }
# then = { hide_host = true, state = "Deep work" }
#
# [[rules]]
# name = "after_hours"
# when = { active_only = true, time = { start = "22:00", end = "06:00" } }
# then = { hide_host = true, state = "Heads down" }
