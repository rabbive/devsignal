[workspace]
resolver = "2"
members = [
    "crates/devsignal-core",
    "crates/devsignal-discord",
    "crates/devsignal-macos",
    "crates/devsignal-daemon",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
# Verified empirically, not guessed: 1.86 and below fail to build. The floor comes from the
# dependency graph (discord-rich-presence 1.1 uses the inherent `str::from_utf8`, stable in 1.87;
# indexmap 2.14 needs edition2024) as well as `Option::is_none_or` in devsignal-core.
# The `msrv` CI job pins this exact version so the claim cannot drift again.
rust-version = "1.87"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.33"
dirs = "6"
# Already in the dependency graph via sysinfo, so this pulls in nothing new. Used for `flock`.
libc = "0.2"
discord-rich-presence = "1.1"
objc2 = "0.6"
objc2-app-kit = "0.3"
ctrlc = { version = "3", features = ["termination"] }
serde_json = "1"
