name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Quieter Actions deprecation notice for checkout (Node 20 → 24); see GitHub changelog 2025-09-19.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Everything except devsignal-macos, which needs the macOS SDK. The daemon is included
      # because CLI parsing and the run loop are no longer behind `cfg(target_os = "macos")`.
      - name: cargo clippy (linux-safe crates)
        run: cargo clippy -p devsignal-core -p devsignal-discord -p devsignal-daemon --all-targets -- -D warnings

      - name: cargo test (linux-safe crates)
        run: cargo test -p devsignal-core -p devsignal-daemon

      # install.sh is the only install path now that the Homebrew formula is gone, so it is worth
      # linting. Not available in every dev environment, which is why it runs here.
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck packaging/macos/install.sh scripts/*.sh

  # The declared MSRV was 1.74 for months while the code needed 1.87; both other jobs use `stable`,
  # so nothing caught it. This job makes rust-version a checked claim.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read declared MSRV
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      # Only devsignal-macos is excluded; it needs the macOS SDK.
      - name: cargo check at MSRV
        run: cargo check -p devsignal-core -p devsignal-discord -p devsignal-daemon --all-targets --locked

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build
        run: cargo build --workspace --release
