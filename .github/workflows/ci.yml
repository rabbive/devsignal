name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Quieter Actions deprecation notice for checkout (Node 20 → 24); see GitHub changelog 2025-09-19.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Everything except devsignal-macos, which needs the macOS SDK. The daemon is included
      # because CLI parsing and the run loop are no longer behind `cfg(target_os = "macos")`.
      - name: cargo clippy (linux-safe crates)
        run: cargo clippy -p devsignal-core -p devsignal-discord -p devsignal-daemon --all-targets -- -D warnings

      - name: cargo test (linux-safe crates)
        run: cargo test -p devsignal-core -p devsignal-daemon

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build
        run: cargo build --workspace --release
