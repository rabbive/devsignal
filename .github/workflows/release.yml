name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  macos-universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # A tag that disagrees with Cargo.toml produces an artifact whose --version lies.
      - name: Check tag matches crate version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # [workspace.package] version is the single definition all crates inherit.
          CRATE_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "tag=${TAG_VERSION} crate=${CRATE_VERSION}"
          if [[ "$TAG_VERSION" != "$CRATE_VERSION" ]]; then
            echo "::error::tag v${TAG_VERSION} does not match Cargo.toml version ${CRATE_VERSION}"
            exit 1
          fi

      - name: Build aarch64
        run: cargo build --release -p devsignal-daemon --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release -p devsignal-daemon --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/devsignal \
            target/x86_64-apple-darwin/release/devsignal \
            -output devsignal
          chmod +x devsignal
          ./devsignal --version

      # Signing and notarization run only when the certificate secret is configured, so forks and
      # unsigned dry-run tags still produce a usable (quarantined) artifact.
      - name: Check for signing credentials
        id: signing
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
        run: |
          if [[ -n "$CERT_P12" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_CERT_P12_BASE64 is not set; publishing an unsigned binary. \
            Users will need to clear the Gatekeeper quarantine attribute."
          fi

      - name: Import certificate and codesign
        if: steps.signing.outputs.available == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # Read the identity hash out of the keychain: the full identity name includes the
          # developer's name, which the team id alone does not give us.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::no Developer ID Application identity found in the imported certificate"
            exit 1
          fi
          codesign --force --timestamp --options runtime --sign "$IDENTITY" devsignal
          codesign --verify --strict --verbose=2 devsignal

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar czvf "devsignal-${VERSION}-macos-universal.tar.gz" devsignal

      # Runs after packaging only because the tarball already contains the signed binary; the
      # submission itself is a separate zip (see below).
      - name: Notarize
        if: steps.signing.outputs.available == 'true'
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          # notarytool accepts zip, pkg, or dmg — not tar.gz — so submit a zip of the binary.
          # A standalone executable cannot be stapled (`stapler` only handles app/dmg/pkg), so
          # Gatekeeper validates the ticket online on first run.
          ditto -c -k --keepParent devsignal "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/notarize.zip"

      # Published so install.sh and any Homebrew formula can verify the download instead of
      # trusting it, and so bumping a formula does not require a manual local shasum.
      - name: Generate checksums
        run: shasum -a 256 devsignal-*-macos-universal.tar.gz > SHA256SUMS

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            devsignal-*-macos-universal.tar.gz
            SHA256SUMS
            packaging/macos/com.devsignal.daemon.example.plist
